<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주변 시설 찾기</title>

  <style>
    /* 전체 화면 설정 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
    }

    /* 왼쪽 검색 영역과 오른쪽 지도 영역 */
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* 왼쪽 사이드바 */
    .sidebar {
      width: 420px;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      background: white;
      border-right: 1px solid #ddd;
    }

    /* 제목 영역 */
    .header {
      padding: 25px 20px 18px;
    }

    .header h1 {
      margin: 0 0 10px;
      font-size: 27px;
      color: #222;
    }

    .header p {
      margin: 0;
      color: #777;
      font-size: 14px;
    }

    /* 탭 버튼 */
    .tab-container {
      display: flex;
      gap: 8px;
      padding: 0 15px 15px;
    }

    .tab-button {
      flex: 1;
      padding: 13px 8px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #f7f7f7;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .tab-button.active {
      background: #fee500;
      border-color: #fee500;
      color: #222;
    }

    .tab-button:hover {
      background: #fff3a6;
    }

    /* 현재 위치 버튼 */
    .location-button {
      margin: 0 15px 15px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    /* 검색 결과 제목 */
    .result-header {
      padding: 17px 20px;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
      font-size: 17px;
      font-weight: bold;
    }

    /* 상태 안내 */
    #status {
      padding: 14px 20px;
      color: #777;
      font-size: 13px;
      line-height: 1.6;
    }

    /* 검색 결과 목록 */
    #resultList {
      flex: 1;
      overflow-y: auto;
    }

    .place-item {
      padding: 17px 20px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .place-item:hover {
      background: #fffbea;
    }

    .place-item.selected {
      background: #fff8d1;
    }

    .place-item h3 {
      margin: 0 0 7px;
      font-size: 15px;
    }

    .place-item p {
      margin: 5px 0;
      color: #666;
      font-size: 12px;
      line-height: 1.5;
    }

    .place-item a {
      display: inline-block;
      margin-top: 7px;
      color: #3267c8;
      font-size: 12px;
      text-decoration: none;
    }

    /* 오른쪽 지도 영역 */
    .map-area {
      position: relative;
      flex: 1;
      min-width: 0;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #eee;
    }

    /* 로드뷰 창 */
    #roadviewPanel {
      display: none;
      position: absolute;
      z-index: 20;
      top: 15px;
      left: 15px;
      right: 15px;
      bottom: 15px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 15px #0003;
      overflow: hidden;
    }

    .roadview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      border-bottom: 1px solid #ddd;
    }

    .roadview-header h2 {
      margin: 0;
      font-size: 17px;
    }

    #closeRoadview {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      background: #eee;
      cursor: pointer;
    }

    #roadview {
      width: 100%;
      height: calc(100% - 52px);
    }

    /* 작은 화면 대응 */
    @media (max-width: 600px) {
      .sidebar {
        width: 48%;
        min-width: 0;
      }

      .header {
        padding: 18px 10px;
      }

      .header h1 {
        font-size: 19px;
      }

      .header p {
        font-size: 11px;
      }

      .tab-container {
        gap: 5px;
        padding: 0 7px 12px;
      }

      .tab-button {
        padding: 11px 3px;
        font-size: 12px;
      }

      .location-button {
        margin: 0 7px 12px;
        padding: 10px 3px;
        font-size: 12px;
      }

      .result-header {
        padding: 13px 10px;
        font-size: 14px;
      }

      #status {
        padding: 10px;
        font-size: 11px;
      }

      .place-item {
        padding: 12px 10px;
      }

        font-size: 13px
