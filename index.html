
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공원과 음수대 찾기</title>

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=30d58f592542917f9846f0a37390e91c&libraries=services&autoload=false"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #222;
    }

    header {
      padding: 18px;
      background: #246b50;
      color: white;
    }

    header h2 { margin: 0 0 6px; }
    header p { margin: 0; font-size: 14px; }

    .container {
      display: flex;
      height: calc(100vh - 90px);
      min-height: 500px;
    }

    .sidebar {
      width: 350px;
      padding: 16px;
      overflow-y: auto;
      border-right: 1px solid #ddd;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
    }

    .tab {
      flex: 1;
      background: #eee;
    }

    .tab.active {
      background: #246b50;
      color: white;
    }

    .search-row {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .main-btn {
      background: #246b50;
      color: white;
    }

    .sub-btn {
      width: 100%;
      margin-bottom: 8px;
      background: #edf4ef;
      color: #246b50;
    }

    #status {
      font-size: 13px;
      color: #666;
      margin: 12px 0;
      line-height: 1.5;
    }

    .place {
      padding: 13px 5px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .place:hover { background: #f4f8f5; }

    .place strong {
      display: block;
      margin-bottom: 6px;
    }

    .place small {
      display: block;
      color: #666;
      line-height: 1.5;
    }

    .place a {
      display: inline-block;
      margin-top: 6px;
      color: #246b50;
      font-size: 13px;
    }

    #map {
      flex: 1;
      min-width: 0;
    }

    .tools {
      padding-top: 12px;
      border-top: 1px solid #ddd;
      margin-top: 14px;
    }

    #roadview {
      width: 100%;
      height: 220px;
      display: none;
      margin-top: 10px;
      border-radius: 8px;
    }

    @media (max-width: 700px) {
      .container {
        height: auto;
        min-height: 0;
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        max-height: 48vh;
      }

      #map {
        flex: none;
        width: 100%;
        height: 55vh;
      }
    }
  </style>
</head>

<body>
  <header>
    <h2>🌳 우리 동네 쉼터 찾기</h2>
    <p>주변 공원과 음수대를 검색하고 거리를 측정해 보세요.</p>
  </header>

  <div class="container">
    <aside class="sidebar">
      <div class="tabs">
        <button class="tab active" id="parkTab">🌳 공원</button>
        <button class="tab" id="waterTab">🚰 음수대</button>
      </div>

      <div class="search-row">
        <input id="keyword" placeholder="장소 또는 지역 검색">
        <button class="main-btn" id="searchBtn">검색</button>
      </div>

      <button class="sub-btn" id="locationBtn">📍 현재 위치로 이동</button>

      <div id="status">지도를 불러오는 중입니다.</div>
      <div id="results"></div>

      <div class="tools">
        <strong>🧭 지도 도구</strong>
        <p style="font-size:13px;color:#666">
          거리 측정은 시작 버튼을 누른 뒤 지도에서 지점을 차례로 클릭하세요.
          마우스 오른쪽 버튼을 누르면 측정이 끝납니다.
        </p>

        <button class="sub-btn" id="measureBtn">📏 거리 측정 시작</button>
        <button class="sub-btn" id="clearBtn">측정 초기화</button>
        <div id="distanceInfo" style="font-size:13px;margin:8px 0 12px">
          측정한 거리가 여기에 표시됩니다.
        </div>

        <button class="sub-btn" id="roadviewBtn">🏙️ 로드뷰 켜기 / 끄기</button>
        <div id="roadview"></div>
      </div>
    </aside>

    <div id="map"></div>
  </div>

  <script>
    kakao.maps.load(function () {
      // 지도와 장소 검색 객체 생성
      const map = new kakao.maps.Map(document.getElementById("map"), {
        center: new kakao.maps.LatLng(37.6584, 126.8320),
        level: 4
      });

      const places = new kakao.maps.services.Places(map);
      const geocoder = new kakao.maps.services.Geocoder();
      const infoWindow = new kakao.maps.InfoWindow({ zIndex: 3 });

      let currentCategory = "park";
      let currentPosition = null;
      let markers = [];
      let measuring = false;
      let measurePoints = [];
      let measureLine = null;
      let measureMarkers = [];
      let roadviewVisible = false;

      const status = document.getElementById("status");
      const results = document.getElementById("results");
      const distanceInfo = document.getElementById("distanceInfo");
      const roadviewBox = document.getElementById("roadview");

      const parkTab = document.getElementById("parkTab");
      const waterTab = document.getElementById("waterTab");

      // 검색할 키워드 설정
      function getSearchKeyword() {
        const input = document.getElementById("keyword").value.trim();

        if (input) {
          if (currentCategory === "water" &&
              !input.includes("음수대") &&
              !input.includes("식수대")) {
            return input + " 음수대";
          }

          if (currentCategory === "park" &&
              !input.includes("공원")) {
            return input + " 공원";
          }

          return input;
        }

        return currentCategory === "park" ? "공원" : "음수대";
      }

      // 기존 검색 마커 삭제
      function clearSearchMarkers() {
        markers.forEach(function (marker) {
          marker.setMap(null);
        });

        markers = [];
        infoWindow.close();
      }

      // 공원 또는 음수대 검색
      function searchPlaces() {
        const keyword = getSearchKeyword();

        const center = currentPosition || map.getCenter();

        status.textContent = "'" + keyword + "' 검색 중...";
        results.innerHTML = "";
        clearSearchMarkers();

        places.keywordSearch(
          keyword,
          function (data, searchStatus, pagination) {
            if (searchStatus === kakao.maps.services.Status.OK) {
              displayPlaces(data);
              status.textContent =
                "검색 결과 " + data.length + "개 · 페이지 " +
                pagination.current + " / " + pagination.last;

              displayPagination(pagination);
            } else if (
              searchStatus === kakao.maps.services.Status.ZERO_RESULT
            ) {
              status.textContent =
                "검색 결과가 없습니다. 다른 키워드로 검색해 보세요.";
            } else {
              status.textContent =
                "검색 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.";
            }
          },
          {
            location: center,
            radius: 20000,
            sort: kakao.maps.services.SortBy.DISTANCE,
            size: 15
          }
        );
      }

      // 검색 결과 목록과 마커 표시
      function displayPlaces(data) {
        const bounds = new kakao.maps.LatLngBounds();

        data.forEach(function (place, index) {
          const position = new kakao.maps.LatLng(place.y, place.x);

          const marker = new kakao.maps.Marker({
            map: map,
            position: position
          });

          markers.push(marker);
          bounds.extend(position);

          kakao.maps.event.addListener(marker, "click", function () {
            showInfo(place, marker);
          });

          const item = document.createElement("div");
          item.className = "place";

          const name = document.createElement("strong");
          name.textContent = (index + 1) + ". " + place.place_name;
          item.appendChild(name);

          const address = document.createElement("small");
          address.textContent =
            place.road_address_name || place.address_name || "주소 정보 없음";
          item.appendChild(address);

          if (place.phone) {
            const phone = document.createElement("small");
            phone.textContent = "☎ " + place.phone;
            item.appendChild(phone);
          }

          const link = document.createElement("a");
          link.href = place.place_url ||
            "https://map.kakao.com/link/search/" +
            encodeURIComponent(place.place_name);
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "카카오맵에서 보기";
          link.addEventListener("click", function (event) {
            event.stopPropagation();
          });
          item.appendChild(link);

          item.addEventListener("click", function () {
            map.setCenter(position);
            map.setLevel(3);
            showInfo(place, marker);
          });

          results.appendChild(item);
        });

        if (data.length > 0) {
          map.setBounds(bounds);
        }
      }

      // 마커 정보창 표시
      function showInfo(place, marker) {
        const content =
          '<div style="padding:10px;font-size:13px;max-width:220px;">' +
          '<strong>' + escapeHTML(place.place_name) + '</strong><br>' +
          escapeHTML(place.road_address_name || place.address_name || "") +
          '<br><a href="' + place.place_url +
          '" target="_blank" rel="noopener noreferrer">카카오맵에서 보기</a>' +
          '</div>';

        infoWindow.setContent(content);
        infoWindow.open(map, marker);
      }

      // 정보창에 들어가는 텍스트 안전 처리
      function escapeHTML(value) {
        return String(value || "").replace(/[&<>"']/g, function (char) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
          }[char];
        });
      }

      // 검색 결과 페이지 이동
      function displayPagination(pagination) {
        const pageBox = document.createElement("div");
        pageBox.style.cssText =
          "display:flex;gap:5px;flex-wrap:wrap;margin-top:12px;";

        for (let i = 1; i <= pagination.last; i++) {
          const button = document.createElement("button");
          button.textContent = i;
          button.style.background =
            i === pagination.current ? "#246b50" : "#eee";
          button.style.color =
            i === pagination.current ? "white" : "#222";

          button.addEventListener("click", function () {
            pagination.gotoPage(i);
          });

          pageBox.appendChild(button);
        }

        results.appendChild(pageBox);
      }

      // 탭 변경
      parkTab.addEventListener("click", function () {
        currentCategory = "park";
        parkTab.classList.add("active");
        waterTab.classList.remove("active");
        searchPlaces();
      });

      waterTab.addEventListener("click", function () {
        currentCategory = "water";
        waterTab.classList.add("active");
        parkTab.classList.remove("active");
        searchPlaces();
      });

      document.getElementById("searchBtn").addEventListener(
        "click", searchPlaces
      );

      document.getElementById("keyword").addEventListener(
        "keydown", function (event) {
          if (event.key === "Enter") searchPlaces();
        }
      );

      // 현재 위치 찾기
      document.getElementById("locationBtn").addEventListener(
        "click", function () {
          if (!navigator.geolocation) {
            status.textContent = "이 브라우저는 위치 기능을 지원하지 않습니다.";
            return;
          }

          status.textContent = "현재 위치를 확인하고 있습니다.";

          navigator.geolocation.getCurrentPosition(
            function (position) {
              currentPosition = new kakao.maps.LatLng(
                position.coords.latitude,
                position.coords.longitude
              );

              map.setCenter(currentPosition);
              map.setLevel(4);

              const marker = new kakao.maps.Marker({
                map: map,
                position: currentPosition,
                title: "내 현재 위치"
              });

              markers.push(marker);

              const circle = new kakao.maps.Circle({
                center: currentPosition,
                radius: 30,
                strokeWeight: 2,
                strokeColor: "#2674e8",
                strokeOpacity: 0.8,
                fillColor: "#2674e8",
                fillOpacity: 0.15,
                map: map
              });

              // 현재 위치 원도 검색 마커와 함께 관리
              markers.push({
                setMap: function () { circle.setMap(null); }
              });

              status.textContent = "현재 위치를 찾았습니다.";
              searchPlaces();
            },
            function () {
              status.textContent =
                "위치를 확인할 수 없습니다. 브라우저 위치 권한을 확인해 주세요.";
            },
            { enableHighAccuracy: true, timeout: 10000 }
          );
        }
      );

      // 거리 측정 시작
      document.getElementById("measureBtn").addEventListener(
        "click", function () {
          measuring = true;
          measurePoints = [];
          clearMeasureDrawing();

          distanceInfo.textContent =
            "지도에서 출발 지점부터 차례로 클릭하세요. 오른쪽 클릭으로 종료합니다.";

          map.setCursor("crosshair");
        }
      );

      // 거리 측정 선과 점 삭제
      function clearMeasureDrawing() {
        if (measureLine) measureLine.setMap(null);
        measureLine = null;

        measureMarkers.forEach(function (marker) {
          marker.setMap(null);
        });

        measureMarkers = [];
      }

      // 지도 클릭 시 거리 측정
      kakao.maps.event.addListener(map, "click", function (mouseEvent) {
        if (!measuring) return;

        const point = mouseEvent.latLng;
        measurePoints.push(point);

        const marker = new kakao.maps.Marker({
          map: map,
          position: point
        });

        measureMarkers.push(marker);

        if (measureLine) measureLine.setMap(null);

        if (measurePoints.length >= 2) {
          measureLine = new kakao.maps.Polyline({
            map: map,
            path: measurePoints,
            strokeWeight: 4,
            strokeColor: "#e34b4b",
            strokeOpacity: 0.9,
            strokeStyle: "solid"
          });

          const meters = Math.round(measureLine.getLength());
          distanceInfo.textContent =
            "현재 거리: " + formatDistance(meters) +
            " · 도보 약 " + Math.ceil(meters / 67) + "분";
        } else {
          distanceInfo.textContent = "출발 지점을 선택했습니다.";
        }
      });

      // 오른쪽 클릭으로 측정 종료
      kakao.maps.event.addListener(map, "rightclick", function () {
        if (!measuring) return;

        measuring = false;
        map.setCursor("default");

        if (measureLine) {
          const meters = Math.round(measureLine.getLength());
          distanceInfo.textContent =
            "최종 거리: " + formatDistance(meters) +
            " · 도보 약 " + Math.ceil(meters / 67) + "분";
        } else {
          distanceInfo.textContent = "지점을 2개 이상 선택해야 합니다.";
        }
      });

      function formatDistance(meters) {
        return meters >= 1000
          ? (meters / 1000).toFixed(2) + "km"
          : meters + "m";
      }

      // 거리 측정 초기화
      document.getElementById("clearBtn").addEventListener(
        "click", function () {
          measuring = false;
          map.setCursor("default");
          measurePoints = [];
          clearMeasureDrawing();
          distanceInfo.textContent = "측정한 거리가 여기에 표시됩니다.";
        }
      );

      // 로드뷰 표시 / 숨기기
      document.getElementById("roadviewBtn").addEventListener(
        "click", function () {
          roadviewVisible = !roadviewVisible;

          if (!roadviewVisible) {
            roadviewBox.style.display = "none";
            return;
          }

          roadviewBox.style.display = "block";

          const roadview = new kakao.maps.Roadview(roadviewBox);
          const roadviewClient = new kakao.maps.RoadviewClient();

          const center = map.getCenter();

          roadviewClient.getNearestPanoId(
            center,
            100,
            function (panoId) {
              if (panoId) {
                roadview.setPanoId(panoId, center);
              } else {
                roadviewBox.textContent =
                  "이 위치에는 로드뷰가 제공되지 않습니다.";
              }
            }
          );
        }
      );

      // 처음에는 공원 검색
      searchPlaces();
    });
  </script>
</body>
</html>
