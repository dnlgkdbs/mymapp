
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 동네 쉼터 찾기</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=30d58f592542917f9846f0a37390e91c&libraries=services&autoload=false"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Gowun Dodum', sans-serif;
      color: #34433a;
      background: #f8fbf7;
    }

    button, input {
      font-family: inherit;
    }

    header {
      padding: 20px 22px;
      background: #3f8058;
      color: white;
    }

    header h2 {
      margin: 0 0 5px;
      font-size: 23px;
    }

    header p {
      margin: 0;
      font-size: 14px;
    }

    .container {
      display: flex;
      height: calc(100vh - 91px);
      min-height: 500px;
    }

    .sidebar {
      width: 365px;
      flex-shrink: 0;
      padding: 17px;
      overflow-y: auto;
      background: #fff;
      border-right: 1px solid #e4ebe3;
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 12px;
      padding: 10px;
      font-size: 14px;
      transition: 0.2s;
    }

    .tab {
      flex: 1;
      background: #edf2ec;
      color: #536557;
      white-space: nowrap;
    }

    .tab.active {
      background: #3f8058;
      color: white;
      font-weight: bold;
    }

    .search-row {
      display: flex;
      gap: 7px;
      margin-bottom: 10px;
    }

    input {
      width: 0;
      flex: 1;
      padding: 11px;
      border: 1px solid #dce5db;
      border-radius: 12px;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #70a982;
    }

    .main-btn {
      background: #3f8058;
      color: white;
      padding: 10px 14px;
    }

    .sub-btn {
      width: 100%;
      margin-bottom: 8px;
      background: #edf5ed;
      color: #39734d;
    }

    button:hover {
      opacity: 0.85;
    }

    #status {
      font-size: 13px;
      color: #748176;
      margin: 13px 0;
      line-height: 1.6;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin: 12px 2px;
      font-size: 13px;
      color: #526457;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .legend-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .place {
      padding: 13px 10px;
      border-bottom: 1px solid #edf1ec;
      border-radius: 10px;
      cursor: pointer;
    }

    .place:hover {
      background: #f4f8f2;
    }

    .place strong {
      display: block;
      margin: 5px 0;
      font-size: 15px;
    }

    .place small {
      display: block;
      color: #788178;
      font-size: 12px;
      line-height: 1.6;
    }

    .place a {
      display: inline-block;
      margin-top: 7px;
      color: #39734d;
      font-size: 12px;
      text-decoration: none;
    }

    .place a:hover {
      text-decoration: underline;
    }

    .category-label {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 20px;
      background: #edf5ed;
      color: #39734d;
      font-size: 11px;
    }

    .water-label {
      background: #e9f4fc;
      color: #2879ae;
    }

    .section-title {
      padding: 13px 5px 8px;
      font-weight: bold;
      font-size: 15px;
      border-bottom: 1px solid #e4ebe3;
    }

    #map {
      flex: 1;
      min-width: 0;
    }

    .tools {
      padding-top: 15px;
      border-top: 1px solid #e4ebe3;
      margin-top: 17px;
    }

    .tools-title {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 7px;
    }

    .tool-description {
      font-size: 12px;
      color: #788178;
      line-height: 1.6;
    }

    #distanceInfo {
      font-size: 12px;
      line-height: 1.6;
      margin: 8px 2px 13px;
      color: #526457;
    }

    #roadview {
      width: 100%;
      height: 220px;
      display: none;
      margin-top: 10px;
      border-radius: 12px;
      overflow: hidden;
    }

    @media (max-width: 700px) {
      .container {
        height: auto;
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        max-height: 48vh;
      }

      #map {
        flex: none;
        width: 100%;
        height: 55vh;
      }
    }
  </style>
</head>

<body>
  <header>
    <h2>🌿 우리 동네 쉼터 찾기</h2>
    <p>주변 공원과 음수대를 한눈에 찾아보세요!</p>
  </header>

  <div class="container">
    <aside class="sidebar">

      <div class="tabs">
        <button class="tab active" id="allTab">전체 보기</button>
        <button class="tab" id="parkTab">🌳 공원</button>
        <button class="tab" id="waterTab">💧 음수대</button>
      </div>

      <div class="search-row">
        <input id="keyword" placeholder="지역 또는 장소 검색">
        <button class="main-btn" id="searchBtn">검색</button>
      </div>

      <button class="sub-btn" id="locationBtn">
        📍 현재 위치로 이동
      </button>

      <div class="legend">
        <span class="legend-item">
          <span class="legend-dot" style="background:#41965b"></span>
          공원
        </span>
        <span class="legend-item">
          <span class="legend-dot" style="background:#3295d0"></span>
          음수대
        </span>
      </div>

      <div id="status">지도를 불러오는 중입니다.</div>
      <div id="results"></div>

      <div class="tools">
        <div class="tools-title">🧭 지도 도구</div>

        <p class="tool-description">
          거리 측정을 시작한 뒤 지도에서 지점을 차례로 클릭하세요.
          오른쪽 클릭으로 측정을 마칠 수 있습니다.
        </p>

        <button class="sub-btn" id="measureBtn">
          📏 거리 측정 시작
        </button>

        <button class="sub-btn" id="clearBtn">
          측정 초기화
        </button>

        <div id="distanceInfo">
          측정한 거리가 여기에 표시됩니다.
        </div>

        <button class="sub-btn" id="roadviewBtn">
          🏙️ 로드뷰 켜기 / 끄기
        </button>

        <div id="roadview"></div>
      </div>
    </aside>

    <div id="map"></div>
  </div>

  <script>
    kakao.maps.load(function () {
      const map = new kakao.maps.Map(
        document.getElementById("map"),
        {
          center: new kakao.maps.LatLng(37.6584, 126.8320),
          level: 4
        }
      );

      const places = new kakao.maps.services.Places(map);
      const geocoder = new kakao.maps.services.Geocoder();
      const infoWindow = new kakao.maps.InfoWindow({ zIndex: 3 });

      let currentCategory = "all";
      let currentPosition = null;
      let searchMarkers = [];
      let currentLocationMarker = null;
      let currentLocationCircle = null;

      let measuring = false;
      let measurePoints = [];
      let measureLine = null;
      let measureMarkers = [];

      let roadviewVisible = false;
      let roadview = null;
      let searchNumber = 0;

      const status = document.getElementById("status");
      const results = document.getElementById("results");
      const distanceInfo = document.getElementById("distanceInfo");
      const roadviewBox = document.getElementById("roadview");

      const allTab = document.getElementById("allTab");
      const parkTab = document.getElementById("parkTab");
      const waterTab = document.getElementById("waterTab");

      // 나무 모양의 초록색 공원 마커
      function makeParkMarker() {
        return `
          <div style="
            width:34px;
            height:42px;
            position:relative;
            display:flex;
            flex-direction:column;
            align-items:center;
            filter:drop-shadow(0 2px 2px rgba(0,0,0,0.18));
          ">
            <svg width="34" height="42" viewBox="0 0 34 42"
                 xmlns="http://www.w3.org/2000/svg">
              <path d="M17 41 C14 35 4 25 4 15
                       A13 13 0 1 1 30 15
                       C30 25 20 35 17 41Z"
                    fill="#41965b" stroke="#ffffff" stroke-width="1.5"/>
              <path d="M17 28 L17 17"
                    stroke="#8b5a35" stroke-width="3"
                    stroke-linecap="round"/>
              <path d="M17 23 L11 18 M17 20 L23 15"
                    stroke="#8b5a35" stroke-width="2.2"
                    stroke-linecap="round"/>
              <circle cx="17" cy="11" r="7" fill="#78c66b"/>
              <circle cx="11" cy="15" r="5" fill="#56ad60"/>
              <circle cx="23" cy="15" r="5" fill="#2f8c4b"/>
              <circle cx="17" cy="7" r="4" fill="#9bdc7d"/>
            </svg>
          </div>
        `;
      }

      // 물방울 모양의 파란색 음수대 마커
      function makeWaterMarker() {
        return `
          <div style="
            width:32px;
            height:40px;
            filter:drop-shadow(0 2px 2px rgba(0,0,0,0.18));
          ">
            <svg width="32" height="40" viewBox="0 0 32 40"
                 xmlns="http://www.w3.org/2000/svg">
              <path d="M16 2
                       C13 9 3 18 3 25
                       A13 13 0 0 0 29 25
                       C29 18 19 9 16 2Z"
                    fill="#3295d0" stroke="#ffffff" stroke-width="1.5"/>
              <path d="M11 25 C11 21 13 18 16 15"
                    fill="none" stroke="#bfeaff"
                    stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </div>
        `;
      }

      // 커스텀 마커 생성
      function createCustomMarker(place, category) {
        const position = new kakao.maps.LatLng(place.y, place.x);

        const content = category === "park"
          ? makeParkMarker()
          : makeWaterMarker();

        const marker = new kakao.maps.CustomOverlay({
          position: position,
          content: content,
          yAnchor: 1,
          zIndex: category === "park" ? 2 : 3
        });

        marker.setMap(map);
        searchMarkers.push(marker);

        kakao.maps.event.addListener(map, "click", function () {
          // 지도 빈 공간 클릭 시 별도 동작 없음
        });

        return marker;
      }

      function setActiveTab(category) {
        currentCategory = category;

        allTab.classList.toggle("active", category === "all");
        parkTab.classList.toggle("active", category === "park");
        waterTab.classList.toggle("active", category === "water");
      }

      function clearSearchMarkers() {
        searchMarkers.forEach(function (marker) {
          marker.setMap(null);
        });

        searchMarkers = [];
        infoWindow.close();
      }

      function showCurrentLocation() {
        if (!currentPosition) return;

        if (currentLocationMarker) {
          currentLocationMarker.setMap(null);
        }

        if (currentLocationCircle) {
          currentLocationCircle.setMap(null);
        }

        currentLocationMarker = new kakao.maps.Marker({
          map: map,
          position: currentPosition,
          title: "내 현재 위치"
        });

        currentLocationCircle = new kakao.maps.Circle({
          center: currentPosition,
          radius: 30,
          strokeWeight: 2,
          strokeColor: "#2674e8",
          strokeOpacity: 0.8,
          fillColor: "#2674e8",
          fillOpacity: 0.15,
          map: map
        });
      }

      function runKeywordSearch(keyword, callback) {
        places.keywordSearch(
          keyword,
          function (data, searchStatus, pagination) {
            callback(data, searchStatus, pagination);
          },
          {
            location: currentPosition || map.getCenter(),
            radius: 20000,
            sort: kakao.maps.services.SortBy.DISTANCE,
            size: 15
          }
        );
      }

      function getSearchKeyword(category) {
        const input = document.getElementById("keyword").value.trim();

        if (input) return input;

        return category === "park" ? "공원" : "음수대";
      }

      function findSearchLocation(query, callback) {
        geocoder.addressSearch(query, function (data, searchStatus) {
          if (
            searchStatus === kakao.maps.services.Status.OK &&
            data.length > 0
          ) {
            callback(new kakao.maps.LatLng(data[0].y, data[0].x));
            return;
          }

          places.keywordSearch(
            query,
            function (data, placeStatus) {
              if (
                placeStatus === kakao.maps.services.Status.OK &&
                data.length > 0
              ) {
                callback(new kakao.maps.LatLng(data[0].y, data[0].x));
              } else {
                callback(null);
              }
            },
            {
              location: map.getCenter(),
              radius: 20000,
              size: 1
            }
          );
        });
      }

      function searchPlaces() {
        const thisSearch = ++searchNumber;
        const input = document.getElementById("keyword").value.trim();

        results.innerHTML = "";
        clearSearchMarkers();
        status.textContent = "장소를 검색하고 있습니다.";

        if (currentCategory === "all" && input) {
          findSearchLocation(input, function (position) {
            if (thisSearch !== searchNumber) return;

            if (position) {
              map.setCenter(position);
              map.setLevel(4);
            }

            searchBothCategories(thisSearch, input);
          });
        } else if (currentCategory === "all") {
          searchBothCategories(thisSearch, "");
        } else {
          const keyword = getSearchKeyword(currentCategory);

          runKeywordSearch(keyword, function (data, searchStatus, pagination) {
            if (thisSearch !== searchNumber) return;

            if (searchStatus === kakao.maps.services.Status.OK) {
              const items = data.map(function (place) {
                return {
                  place: place,
                  category: currentCategory
                };
              });

              displayResults(items, true);

              status.textContent = "검색 결과 " + data.length + "개";
              displayPagination(pagination, thisSearch);
            } else if (
              searchStatus === kakao.maps.services.Status.ZERO_RESULT
            ) {
              status.textContent = "검색 결과가 없습니다.";
            } else {
              status.textContent = "검색 중 오류가 발생했습니다.";
            }
          });
        }
      }

      // 전체 보기: 공원과 음수대 각각 검색
      function searchBothCategories(thisSearch, input) {
        const parkKeyword = input ? input + " 공원" : "공원";
        const waterKeyword = input ? input + " 음수대" : "음수대";

        let completed = 0;
        let allItems = [];
        let parkCount = 0;
        let waterCount = 0;

        function finishSearch(data, searchStatus, category) {
          if (thisSearch !== searchNumber) return;

          if (searchStatus === kakao.maps.services.Status.OK) {
            const items = data.map(function (place) {
              return {
                place: place,
                category: category
              };
            });

            allItems = allItems.concat(items);

            if (category === "park") {
              parkCount = data.length;
            } else {
              waterCount = data.length;
            }
          }

          completed++;

          if (completed === 2) {
            if (allItems.length > 0) {
              displayResults(allItems, true);

              status.textContent =
                "전체 " + allItems.length + "개 · 공원 " +
                parkCount + "개 · 음수대 " + waterCount + "개";
            } else {
              status.textContent =
                "검색 결과가 없습니다. 다른 지역을 검색해 보세요.";
            }
          }
        }

        runKeywordSearch(parkKeyword, function (data, resultStatus) {
          finishSearch(data, resultStatus, "park");
        });

        runKeywordSearch(waterKeyword, function (data, resultStatus) {
          finishSearch(data, resultStatus, "water");
        });
      }

      function displayResults(items, fitBounds) {
        const bounds = new kakao.maps.LatLngBounds();
        results.innerHTML = "";

        if (currentCategory === "all") {
          const parks = items.filter(item => item.category === "park");
          const waters = items.filter(item => item.category === "water");

          addSectionTitle("🌳 공원", parks.length);
          addPlaceItems(parks, bounds);

          addSectionTitle("💧 음수대", waters.length);
          addPlaceItems(waters, bounds);
        } else {
          addPlaceItems(items, bounds);
        }

        if (fitBounds && !bounds.isEmpty()) {
          map.setBounds(bounds);
        }

        showCurrentLocation();
      }

      function addSectionTitle(title, count) {
        const heading = document.createElement("div");
        heading.className = "section-title";
        heading.textContent = title + " (" + count + "개)";
        results.appendChild(heading);
      }

      function addPlaceItems(items, bounds) {
        items.forEach(function (item) {
          const place = item.place;
          const category = item.category;
          const position = new kakao.maps.LatLng(place.y, place.x);

          const marker = createCustomMarker(place, category);
          bounds.extend(position);

          // 마커 클릭 시 정보창 표시를 위한 클릭 영역
          const markerClickTarget = document.createElement("div");
          markerClickTarget.style.cssText =
            "position:absolute;width:34px;height:42px;cursor:pointer;";

          const itemBox = document.createElement("div");
          itemBox.className = "place";

          const label = document.createElement("span");
          label.className = category === "park"
            ? "category-label"
            : "category-label water-label";
          label.textContent = category === "park" ? "🌳 공원" : "💧 음수대";
          itemBox.appendChild(label);

          const name = document.createElement("strong");
          name.textContent = place.place_name;
          itemBox.appendChild(name);

          const address = document.createElement("small");
          address.textContent =
            place.road_address_name ||
            place.address_name ||
            "주소 정보 없음";
          itemBox.appendChild(address);

          if (place.phone) {
            const phone = document.createElement("small");
            phone.textContent = "☎ " + place.phone;
            itemBox.appendChild(phone);
          }

          const link = document.createElement("a");
          link.href = place.place_url ||
            "https://map.kakao.com/link/search/" +
            encodeURIComponent(place.place_name);
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "카카오맵에서 보기";

          link.addEventListener("click", function (event) {
            event.stopPropagation();
          });

          itemBox.appendChild(link);

          itemBox.addEventListener("click", function () {
            map.setCenter(position);
            map.setLevel(3);
            showInfo(place, marker, category);
          });

          results.appendChild(itemBox);

          // 마커에 클릭 이벤트를 연결하는 투명 오버레이
          const clickOverlay = new kakao.maps.CustomOverlay({
            position: position,
            content: markerClickTarget,
            yAnchor: 1,
            zIndex: 10
          });

          clickOverlay.setMap(map);
          searchMarkers.push(clickOverlay);

          markerClickTarget.addEventListener("click", function () {
            showInfo(place, marker, category);
          });
        });
      }

      function showInfo(place, marker, category) {
        const categoryName =
          category === "park" ? "🌳 공원" : "💧 음수대";

        const content =
          '<div style="padding:10px;font-size:13px;max-width:230px;font-family:Gowun Dodum,sans-serif;">' +
          '<div>' + categoryName + '</div>' +
          '<strong>' + escapeHTML(place.place_name) + '</strong><br>' +
          escapeHTML(place.road_address_name || place.address_name || "") +
          '<br><a href="' + place.place_url +
          '" target="_blank" rel="noopener noreferrer">카카오맵에서 보기</a>' +
          '</div>';

        infoWindow.setContent(content);
        infoWindow.open(map);
      }

      function escapeHTML(value) {
        return String(value || "").replace(/[&<>"']/g, function (char) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
          }[char];
        });
      }

      function displayPagination(pagination, thisSearch) {
        const pageBox = document.createElement("div");
        pageBox.style.cssText =
          "display:flex;gap:5px;flex-wrap:wrap;margin-top:12px;";

        for (let i = 1; i <= pagination.last; i++) {
          const button = document.createElement("button");
          button.textContent = i;
          button.style.background =
            i === pagination.current ? "#3f8058" : "#edf2ec";
          button.style.color =
            i === pagination.current ? "white" : "#34433a";

          button.addEventListener("click", function () {
            if (thisSearch === searchNumber) {
              pagination.gotoPage(i);
            }
          });

          pageBox.appendChild(button);
        }

        results.appendChild(pageBox);
      }

      // 탭 전환
      allTab.addEventListener("click", function () {
        setActiveTab("all");
        document.getElementById("keyword").value = "";
        searchPlaces();
      });

      parkTab.addEventListener("click", function () {
        setActiveTab("park");
        document.getElementById("keyword").value = "";
        searchPlaces();
      });

      waterTab.addEventListener("click", function () {
        setActiveTab("water");
        document.getElementById("keyword").value = "";
        searchPlaces();
      });

      document.getElementById("searchBtn").addEventListener(
        "click", searchPlaces
      );

      document.getElementById("keyword").addEventListener(
        "keydown", function (event) {
          if (event.key === "Enter") searchPlaces();
        }
      );

      // 현재 위치 찾기
      document.getElementById("locationBtn").addEventListener(
        "click", function () {
          if (!navigator.geolocation) {
            status.textContent = "브라우저가 위치 기능을 지원하지 않습니다.";
            return;
          }

          status.textContent = "현재 위치를 확인하고 있습니다.";

          navigator.geolocation.getCurrentPosition(
            function (position) {
              currentPosition = new kakao.maps.LatLng(
                position.coords.latitude,
                position.coords.longitude
              );

              map.setCenter(currentPosition);
              map.setLevel(4);
              showCurrentLocation();

              document.getElementById("keyword").value = "";
              searchPlaces();
            },
            function () {
              status.textContent =
                "위치를 확인할 수 없습니다. 브라우저 위치 권한을 확인해 주세요.";
            },
            { enableHighAccuracy: true, timeout: 10000 }
          );
        }
      );

      // 거리 측정
      document.getElementById("measureBtn").addEventListener(
        "click", function () {
          measuring = true;
          measurePoints = [];
          clearMeasureDrawing();

          distanceInfo.textContent =
            "지도에서 지점을 차례로 클릭하세요. 오른쪽 클릭으로 종료합니다.";

          map.setCursor("crosshair");
        }
      );

      function clearMeasureDrawing() {
        if (measureLine) measureLine.setMap(null);
        measureLine = null;

        measureMarkers.forEach(function (marker) {
          marker.setMap(null);
        });

        measureMarkers = [];
      }

      kakao.maps.event.addListener(map, "click", function (mouseEvent) {
        if (!measuring) return;

        measurePoints.push(mouseEvent.latLng);

        const marker = new kakao.maps.Marker({
          map: map,
          position: mouseEvent.latLng
        });

        measureMarkers.push(marker);

        if (measureLine) measureLine.setMap(null);

        if (measurePoints.length >= 2) {
          measureLine = new kakao.maps.Polyline({
            map: map,
            path: measurePoints,
            strokeWeight: 4,
            strokeColor: "#e34b4b",
            strokeOpacity: 0.9
          });

          const meters = Math.round(measureLine.getLength());

          distanceInfo.textContent =
            "현재 거리: " + formatDistance(meters) +
            " · 도보 약 " + Math.ceil(meters / 67) + "분";
        } else {
          distanceInfo.textContent = "출발 지점을 선택했습니다.";
        }
      });

      kakao.maps.event.addListener(map, "rightclick", function () {
        if (!measuring) return;

        measuring = false;
        map.setCursor("default");

        if (measureLine) {
          const meters = Math.round(measureLine.getLength());

          distanceInfo.textContent =
            "최종 거리: " + formatDistance(meters) +
            " · 도보 약 " + Math.ceil(meters / 67) + "분";
        } else {
          distanceInfo.textContent = "지점을 2개 이상 선택해야 합니다.";
        }
      });

      function formatDistance(meters) {
        return meters >= 1000
          ? (meters / 1000).toFixed(2) + "km"
          : meters + "m";
      }

      document.getElementById("clearBtn").addEventListener(
        "click", function () {
          measuring = false;
          map.setCursor("default");
          measurePoints = [];
          clearMeasureDrawing();
          distanceInfo.textContent = "측정한 거리가 여기에 표시됩니다.";
        }
      );

      // 로드뷰
      document.getElementById("roadviewBtn").addEventListener(
        "click", function () {
          roadviewVisible = !roadviewVisible;

          if (!roadviewVisible) {
            roadviewBox.style.display = "none";
            return;
          }

          roadviewBox.style.display = "block";
          roadviewBox.textContent = "";

          if (!roadview) {
            roadview = new kakao.maps.Roadview(roadviewBox);
          }

          const roadviewClient = new kakao.maps.RoadviewClient();
          const center = map.getCenter();

          roadviewClient.getNearestPanoId(
            center,
            100,
            function (panoId) {
              if (panoId) {
                roadview.setPanoId(panoId, center);
              } else {
                roadviewBox.textContent =
                  "이 위치에는 로드뷰가 제공되지 않습니다.";
              }
            }
          );
        }
      );

      // 처음에는 전체 보기
      searchPlaces();
    });
  </script>
</body>
</html>
